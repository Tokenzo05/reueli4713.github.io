<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Storefront</title>
    <!-- This line connects your HTML to your stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Welcome to My Shop</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="storefront.html" class="active">Shop</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Storefront Content -->
    <main>
        <h2>Featured Products</h2>
        
        <div class="product-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product 1">
                <h3>Cool Item Alpha</h3>
                <p class="price">$19.99</p>
                <button class="buy-btn">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product 2">
                <h3>Awesome Item Beta</h3>
                <p class="price">$29.99</p>
                <button class="buy-btn">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product 3">
                <h3>Premium Item Gamma</h3>
                <p class="price">$49.99</p>
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My GitHub Storefront. All rights reserved.</p>
    </footer>

</body>
</html>
